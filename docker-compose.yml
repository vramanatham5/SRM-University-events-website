services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      REGISTRATIONS_FILE: /data/registrations.csv
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in the .env file}
    volumes:
      - registrations:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in the .env file}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  registrations:
  caddy_data:
  caddy_config:
